<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelas Management G</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose-gold: #b76e79;
    --rose-gold-light: #d4a0a7;
    --rose-gold-pale: #f2d4d7;
    --rose-gold-deep: #8b4a55;
    --black: #0a0a0a;
    --black-soft: #111111;
    --black-card: #161616;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --cream: #faf5f0;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* CUSTOM CURSOR */
  .cursor {
    width: 12px; height: 12px;
    background: var(--rose-gold);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, width 0.3s, height 0.3s, background 0.3s;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1.5px solid var(--rose-gold-light);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.18s ease, width 0.3s, height 0.3s, opacity 0.3s;
    opacity: 0.6;
  }

  /* BACKGROUND CANVAS */
  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* NOISE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    opacity: 0.4;
  }

  /* SECTIONS */
  section { position: relative; z-index: 2; }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 60px 20px;
    position: relative;
    overflow: hidden;
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid var(--rose-gold);
    padding: 8px 22px;
    border-radius: 30px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rose-gold-light);
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }
  .hero-badge::before, .hero-badge::after {
    content: '◆';
    font-size: 7px;
    color: var(--gold);
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(64px, 12vw, 140px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--rose-gold-pale) 0%, var(--rose-gold) 40%, var(--gold) 70%, var(--rose-gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    animation: fadeUp 1s ease 0.4s forwards;
    position: relative;
  }

  .hero-subtitle-wrapper {
    opacity: 0;
    animation: fadeUp 0.8s ease 0.7s forwards;
    margin-top: 16px;
  }

  .hero-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--rose-gold-light);
  }

  .hero-divider {
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose-gold), var(--gold), var(--rose-gold), transparent);
    margin: 28px auto;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.9s forwards;
  }

  .hero-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 2vw, 18px);
    color: var(--gold-light);
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.1s forwards;
  }

  .hero-count {
    margin-top: 50px;
    display: flex; gap: 50px;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.3s forwards;
  }

  .count-item { text-align: center; }
  .count-num {
    font-family: 'Playfair Display', serif;
    font-size: 42px; font-weight: 700;
    color: var(--rose-gold);
    display: block;
  }
  .count-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rose-gold-light);
    opacity: 0.7;
  }

  .scroll-hint {
    position: absolute; bottom: 36px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.8s forwards;
  }
  .scroll-hint span {
    font-size: 9px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--rose-gold-light); opacity: 0.5;
  }
  .scroll-line {
    width: 1px; height: 50px;
    background: linear-gradient(to bottom, var(--rose-gold), transparent);
    animation: scrollAnim 1.5s ease-in-out infinite;
  }
  @keyframes scrollAnim {
    0%,100% { transform: scaleY(1); opacity:1; }
    50% { transform: scaleY(0.5); opacity:0.4; }
  }

  /* ===== MEMBERS SECTION ===== */
  .members-section {
    padding: 100px 40px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .section-header {
    text-align: center;
    margin-bottom: 70px;
  }

  .section-eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 5vw, 58px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--white), var(--rose-gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 18px;
  }

  .section-line {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose-gold), transparent);
    margin: 0 auto;
  }

  /* GRID */
  .members-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .member-card {
    background: var(--black-card);
    border: 1px solid rgba(183, 110, 121, 0.15);
    border-radius: 16px;
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1), border-color 0.3s, box-shadow 0.4s;
    opacity: 0;
    transform: translateY(30px);
    cursor: none;
  }

  .member-card.visible {
    animation: cardReveal 0.6s ease forwards;
  }

  @keyframes cardReveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .member-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(183,110,121,0.07) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
  }

  .member-card::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.06), transparent);
    transition: left 0.6s ease;
  }

  .member-card:hover {
    transform: translateY(-6px);
    border-color: rgba(183, 110, 121, 0.5);
    box-shadow: 0 20px 60px rgba(183, 110, 121, 0.15), 0 0 0 1px rgba(201,169,110,0.1);
  }

  .member-card:hover::before { opacity: 1; }
  .member-card:hover::after { left: 150%; }

  .card-number {
    position: absolute;
    top: 20px; right: 20px;
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    color: rgba(183,110,121,0.4);
    letter-spacing: 1px;
  }

  .card-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rose-gold-deep), var(--rose-gold));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
    color: var(--black);
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }

  .card-avatar::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid rgba(183,110,121,0.3);
    transition: border-color 0.3s;
  }

  .member-card:hover .card-avatar::after {
    border-color: var(--rose-gold);
  }

  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; font-weight: 600;
    color: var(--cream);
    margin-bottom: 6px;
    line-height: 1.3;
    position: relative; z-index: 1;
  }

  .card-nim {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--rose-gold-light);
    opacity: 0.6;
    position: relative; z-index: 1;
  }

  .card-dot {
    position: absolute;
    bottom: 20px; right: 20px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rose-gold);
    opacity: 0.4;
    transition: opacity 0.3s, transform 0.3s;
  }

  .member-card:hover .card-dot {
    opacity: 1;
    transform: scale(1.5);
    box-shadow: 0 0 10px var(--rose-gold);
  }

  /* ===== FOOTER ===== */
  footer {
    position: relative; z-index: 2;
    text-align: center;
    padding: 60px 20px 40px;
    border-top: 1px solid rgba(183,110,121,0.15);
  }

  .footer-logo {
    font-family: 'Playfair Display', serif;
    font-size: 36px; font-weight: 900;
    background: linear-gradient(135deg, var(--rose-gold), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .footer-text {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rose-gold-light);
    opacity: 0.4;
  }

  .footer-diamonds {
    display: flex; gap: 10px; justify-content: center;
    margin: 24px 0;
    font-size: 8px; color: var(--rose-gold); opacity: 0.4;
    letter-spacing: 6px;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* FLOATING DIAMONDS */
  .floating-diamonds {
    position: fixed;
    inset: 0; pointer-events: none; z-index: 1;
    overflow: hidden;
  }
  .fdiamond {
    position: absolute;
    font-size: 12px;
    color: var(--rose-gold);
    opacity: 0;
    animation: floatDiamond linear infinite;
  }
  @keyframes floatDiamond {
    0%   { opacity: 0; transform: translateY(100vh) rotate(0deg); }
    10%  { opacity: 0.15; }
    90%  { opacity: 0.1; }
    100% { opacity: 0; transform: translateY(-10vh) rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .members-section { padding: 60px 16px; }
    .hero-count { gap: 30px; }
    .members-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .member-card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<!-- Cursor -->
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- BG Canvas -->
<canvas id="bg"></canvas>

<!-- Floating diamonds -->
<div class="floating-diamonds" id="diamonds"></div>

<!-- HERO -->
<section class="hero">
  <div class="hero-badge">Universitas · Fakultas Ekonomi & Bisnis</div>

  <h1 class="hero-title">MGMT<br>CLASS G</h1>

  <div class="hero-subtitle-wrapper">
    <div class="hero-subtitle">Management · Class G</div>
  </div>

  <div class="hero-divider"></div>
  <div class="hero-desc">2024 / 2025 · Angkatan 2024</div>

  <div class="hero-count">
    <div class="count-item">
      <span class="count-num" id="counterNum">0</span>
      <span class="count-label">Anggota</span>
    </div>
    <div class="count-item">
      <span class="count-num">G</span>
      <span class="count-label">Kelas</span>
    </div>
    <div class="count-item">
      <span class="count-num">2024</span>
      <span class="count-label">Angkatan</span>
    </div>
  </div>

  <div class="scroll-hint">
    <span>Scroll</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- MEMBERS -->
<section class="members-section">
  <div class="section-header">
    <div class="section-eyebrow">◆ Daftar Anggota ◆</div>
    <h2 class="section-title">Our Members</h2>
    <div class="section-line"></div>
  </div>

  <div class="members-grid" id="membersGrid"></div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">MG</div>
  <div class="footer-diamonds">◆ ◆ ◆ ◆ ◆</div>
  <div class="footer-text">Management Class G · Angkatan 2024 · Together We Grow</div>
</footer>

<script>
  // ===== DATA =====
  const members = [
    { no: 1,  name: "Mohamad Bagas Iskandar",      nim: "021124052" },
    { no: 2,  name: "Nina Mutia Passa",             nim: "021124053" },
    { no: 3,  name: "Althaf Faiz Azizi",            nim: "021124055" },
    { no: 4,  name: "Maulana Banu Wiguna",          nim: "021124056" },
    { no: 5,  name: "Natasya Aulya",                nim: "021124057" },
    { no: 6,  name: "Kayana Alfita Putri",          nim: "021124058" },
    { no: 7,  name: "Erlina Cholifatin",            nim: "021124059" },
    { no: 8,  name: "Lukman Tedi Saputra",          nim: "021124060" },
    { no: 9,  name: "Anindita Ramadhani",           nim: "021124062" },
    { no: 10, name: "Dhea Ayu Dhenata",             nim: "021124063" },
    { no: 11, name: "Mutiara",                      nim: "021124067" },
    { no: 12, name: "Kania Maulidina",              nim: "021124070" },
    { no: 13, name: "Refa Dalilatunnisa",           nim: "021124071" },
    { no: 14, name: "Fanny Putri Hartanti",         nim: "021124072" },
    { no: 15, name: "Muhamad Ridwan",               nim: "021124074" },
    { no: 16, name: "Moch Rafa Putra Hidayat",      nim: "021124075" },
    { no: 17, name: "Putri Aprilia Hamzah",         nim: "021124076" },
    { no: 18, name: "Sintia Nova",                  nim: "021124077" },
    { no: 19, name: "Nayla Anggraini Putri",        nim: "021124078" },
    { no: 20, name: "Almaira Siti Fahriaz",         nim: "021124079" },
    { no: 21, name: "Nur Intan Fitriani",           nim: "021124081" },
    { no: 22, name: "Asep Ruyana",                  nim: "021124082" },
    { no: 23, name: "Naina Najwa Al Salsabilla",    nim: "021124083" },
    { no: 24, name: "Natasiya Amelia",              nim: "021124084" },
    { no: 25, name: "Fitri Sulastri",               nim: "021124087" },
    { no: 26, name: "Muhammad Aldo Saputra",        nim: "021124094" },
    { no: 27, name: "Mohammad Arya Shidqan",        nim: "021124098" },
    { no: 28, name: "Maria Mita Dwi Aprilia Bagri", nim: "021124099" },
    { no: 29, name: "Sayidah",                      nim: "021124100" },
  ];

  // ===== CURSOR =====
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function animCursor() {
    cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(animCursor);
  }
  animCursor();

  // ===== CANVAS BG =====
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const particles = Array.from({length: 70}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.5 + 0.3,
    alpha: Math.random() * 0.4 + 0.05,
    type: Math.random() > 0.5 ? 'rose' : 'gold'
  }));

  function drawBg() {
    ctx.clearRect(0, 0, W, H);

    // Radial gradient background
    const grad = ctx.createRadialGradient(W*0.3, H*0.2, 0, W*0.5, H*0.5, W*0.8);
    grad.addColorStop(0, 'rgba(139,74,85,0.12)');
    grad.addColorStop(0.4, 'rgba(26,10,10,0.9)');
    grad.addColorStop(1, 'rgba(10,10,10,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Second accent
    const grad2 = ctx.createRadialGradient(W*0.8, H*0.8, 0, W*0.8, H*0.8, W*0.5);
    grad2.addColorStop(0, 'rgba(201,169,110,0.07)');
    grad2.addColorStop(1, 'transparent');
    ctx.fillStyle = grad2;
    ctx.fillRect(0, 0, W, H);

    // Particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.type === 'rose'
        ? `rgba(183,110,121,${p.alpha})`
        : `rgba(201,169,110,${p.alpha})`;
      ctx.fill();
    });

    // Connection lines
    for (let i = 0; i < particles.length; i++) {
      for (let j = i+1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(183,110,121,${0.06 * (1 - dist/100)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawBg);
  }
  drawBg();

  // ===== FLOATING DIAMONDS =====
  const container = document.getElementById('diamonds');
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div');
    d.className = 'fdiamond';
    d.textContent = '◆';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.fontSize = (Math.random() * 10 + 6) + 'px';
    d.style.animationDuration = (Math.random() * 20 + 15) + 's';
    d.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(d);
  }

  // ===== COUNTER =====
  const counterEl = document.getElementById('counterNum');
  let counted = false;
  function countUp() {
    if (counted) return;
    counted = true;
    let n = 0;
    const interval = setInterval(() => {
      n++;
      counterEl.textContent = n;
      if (n >= members.length) clearInterval(interval);
    }, 60);
  }
  setTimeout(countUp, 1600);

  // ===== RENDER CARDS =====
  const grid = document.getElementById('membersGrid');
  members.forEach((m, i) => {
    const initial = m.name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
    const card = document.createElement('div');
    card.className = 'member-card';
    card.style.animationDelay = (i * 0.045) + 's';
    card.innerHTML = `
      <span class="card-number">${String(m.no).padStart(2,'0')}</span>
      <div class="card-avatar">${initial}</div>
      <div class="card-name">${m.name}</div>
      <div class="card-nim">NIM · ${m.nim}</div>
      <div class="card-dot"></div>
    `;
    grid.appendChild(card);
  });

  // ===== INTERSECTION OBSERVER =====
  const cards = document.querySelectorAll('.member-card');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.1 });
  cards.forEach(c => obs.observe(c));
</script>
</body>
</html>
